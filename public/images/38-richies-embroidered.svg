    <text x="300" y="349" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" font-style="italic" letter-spacing="-5" fill="#3b302c" stroke="#382c29" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">Richies</text>
    <text x="300" y="341" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" font-style="italic" letter-spacing="-5" fill="url(#cream-thread)" stroke="#f7ecd7" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">Richies</text>
    <text x="300" y="341" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" font-style="italic" letter-spacing="-5" fill="none" stroke="#aa8f70" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round">Richies</text>

