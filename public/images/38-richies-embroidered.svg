<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="title description">
  <title id="title">38 RICHIES embroidered heritage emblem</title>
  <desc id="description">A burgundy, cream, forest green, burnt orange, muted blue, and brown stitched emblem with 38 above Richies.</desc>
  <defs>
    <filter id="thread-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v10" stroke="#f2e7d4" stroke-width="2" opacity=".28"/>
      <path d="M5 0v10" stroke="#b94f34" stroke-width="1.5" opacity=".5"/>
    </pattern>
    <linearGradient id="cream-thread" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3dc"/>
      <stop offset=".55" stop-color="#e9d8bc"/>
      <stop offset="1" stop-color="#cbb89b"/>
    </linearGradient>
  </defs>

  <g filter="url(#thread-shadow)">
    <path d="M110 56Q300 20 490 56L530 96V253Q300 317 70 253V96Z" fill="#6f2638" stroke="#3f332e" stroke-width="18" stroke-linejoin="round"/>
    <path d="M110 56Q300 20 490 56L530 96V253Q300 317 70 253V96Z" fill="none" stroke="#eadbc2" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>
    <path d="M124 72Q300 43 476 72L509 104V239Q300 295 91 239V104Z" fill="none" stroke="#d6b48c" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>

    <path d="M105 125h45v16h-45zm0 26h33v14h-33zm345-26h45v16h-45zm12 26h33v14h-33z" fill="#315744" stroke="#e7d9c1" stroke-width="3"/>
    <path d="M105 180h37v14h-37zm353 0h37v14h-37z" fill="#bd5638" stroke="#e7d9c1" stroke-width="3"/>
    <path d="M115 214h34v12h-34zm336 0h34v12h-34z" fill="#49627a" stroke="#e7d9c1" stroke-width="3"/>

    <text x="300" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="900" letter-spacing="-10" fill="#3b302c" stroke="#382c29" stroke-width="19" stroke-linejoin="round" paint-order="stroke fill">38</text>
    <text x="300" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="900" letter-spacing="-10" fill="url(#cream-thread)" stroke="#f7ecd7" stroke-width="5" stroke-linejoin="round" paint-order="stroke fill">38</text>
    <text x="300" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="900" letter-spacing="-10" fill="none" stroke="#aa8f70" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round">38</text>

    <path d="M57 263Q300 224 543 263L524 369Q300 422 76 369Z" fill="#315744" stroke="#3b302c" stroke-width="18" stroke-linejoin="round"/>
    <path d="M57 263Q300 224 543 263L524 369Q300 422 76 369Z" fill="none" stroke="#eadbc2" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>
    <path d="M78 275Q300 243 522 275L507 354Q300 401 93 354Z" fill="none" stroke="#d6b48c" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>

